name: release

# Builds everything a host needs to play 32-bit Windows plugins as WebCLAPs and,
# on a v* tag, publishes it as a GitHub release:
#
#   vstloader-runtime.tar.gz   vstloader/: the runtime site a host serves on its
#                              own origin (buzz-remote: next to the app, so at
#                              <apps root>/vstloader/). runtime/ holds the
#                              runtime page, the browser wrapper (wrap.html) and
#                              the shim; boxedwine/ holds Boxedwine's
#                              multithreaded build, Wine's filesystem and vsthost.
#   *.wclap.tar.gz             wrapped plugins, ready for buzz-remote's Plugins
#                              dialog: the PoC test plugins (VST2 and VST3) and
#                              Dexed 0.9.3 (GPL-3.0, third-party).
#
# The bundles name their runtime by URL (--runtime). A tag uses the repository
# variable VSTLOADER_RUNTIME_URL, or the PrometheOS deployment's path; a manual
# run can pass another. Bundles for any other deployment come from that
# deployment's own wrap.html.
#
# A release made on GitHub first (which creates the tag) gets the files
# attached; a manual run with `tag` publishes to that release, creating it
# and its tag at this commit if needed.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'build.sh'
      - 'host/**'
      - 'patches/**'
      - 'runtime/**'
      - 'wclap/**'
      - 'web/**'
      - 'wrap/**'
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Runtime URL the wrapped plugins name'
        default: ''
      tag:
        description: 'Publish to this release tag (for example v0.1.0); empty builds only'
        default: ''

permissions:
  contents: read

env:
  BOXEDWINE_COMMIT: 509f6a7545e0827a27ed1b4ebab66ac1da4b1ea7
  EMSDK_VERSION: 6.0.11
  WASI_SDK_VERSION: '25'
  PLAYWRIGHT_VERSION: 1.56.1
  DEFAULT_RUNTIME_URL: /prometheos-apps/vstloader/runtime/index.html

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Initialize VST3 pluginterfaces and CLAP
        run: git submodule update --init vendor/pluginterfaces vendor/clap
      - name: Install MinGW (i686)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 g++-mingw-w64-i686 zip

      - name: wasi-sdk
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          tar xzf /tmp/wasi-sdk.tar.gz -C /tmp
          echo "WASI_SDK=/tmp/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Build Windows host for native Buzz gate
        run: BUILD_SITE=0 ./build.sh

      - name: Fetch a real Robotplanet Buzz machine fixture
        run: |
          # FSM Kick XP 1.0 SP1 is a native x86 Buzz generator. Buze's package
          # index pins this Robotplanet download to SHA-1
          # dff3b3fdc352ec9b9cd709bbfc15312cfc31a19d.
          curl -fsSL -o /tmp/fsm-kick-xp.zip 'https://buzz.robotplanet.dk/download.php?type=machine&id=8429'
          echo 'dff3b3fdc352ec9b9cd709bbfc15312cfc31a19d  /tmp/fsm-kick-xp.zip' | sha1sum -c -
          unzip -j -o /tmp/fsm-kick-xp.zip 'FSM Kick XP.dll' -d build
          test -s 'build/FSM Kick XP.dll'

      - name: Render real Robotplanet Buzz generator through 32-bit Wine
        run: |
          python3 tests/make_buzz_capture.py /tmp/fsm-kick-xp.capture
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine32:i386
          test -x /usr/lib/wine/wine
          i686-w64-mingw32-objdump -p build/vsthost.exe | grep 'DLL Name'
          HOST_WIN="Z:${PWD//\//\\}\\build\\vsthost.exe"
          DLL_WIN="Z:${PWD//\//\\}\\build\\FSM Kick XP.dll"
          timeout 45s env WINEARCH=win32 WINEPREFIX="$RUNNER_TEMP/wine32-prefix" WINEDEBUG=-all \
            /usr/lib/wine/wine "$HOST_WIN" --replay "$DLL_WIN" \
            'Z:\\tmp\\fsm-kick-xp.capture' 'Z:\\tmp\\fsm-kick-xp.f32'
          python3 - <<'PY'
          import json, math, struct
          p = '/tmp/fsm-kick-xp.f32'
          raw = open(p, 'rb').read()
          samples = struct.unpack('<%df' % (len(raw)//4), raw)
          finite = [x for x in samples if math.isfinite(x)]
          peak = max((abs(x) for x in finite), default=0.0)
          rms = math.sqrt(sum(x*x for x in finite) / max(1, len(finite)))
          nonzero = sum(abs(x) > 1e-7 for x in finite)
          result = {'samples': len(samples), 'finite': len(finite), 'peak': peak, 'rms': rms, 'nonzero': nonzero}
          print(json.dumps(result))
          assert len(finite) == len(samples), result
          assert peak > 1e-6 and nonzero >= 100, result
          PY

      # Boxedwine (GPL-2.0-or-later) at a pinned commit with patches/boxedwine/,
      # built with Emscripten: the multithreaded JIT build the runtime needs.
      - name: Cache the Boxedwine build
        id: boxedwine-cache
        uses: actions/cache@v4
        with:
          path: ~/boxedwine-build
          key: boxedwine-mtjit-${{ env.BOXEDWINE_COMMIT }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('patches/boxedwine/*.patch') }}
      - name: Build Boxedwine (multithreaded JIT)
        if: steps.boxedwine-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          source ~/emsdk/emsdk_env.sh
          git clone --filter=blob:none https://github.com/danoon2/Boxedwine ~/Boxedwine
          git -C ~/Boxedwine checkout "$BOXEDWINE_COMMIT"
          git -C ~/Boxedwine apply "$GITHUB_WORKSPACE"/patches/boxedwine/*.patch
          make -C ~/Boxedwine/project/emscripten -j"$(nproc)" multiThreadedJit
          mkdir -p ~/boxedwine-build
          cp -r ~/Boxedwine/project/emscripten/Build/MultiThreadedJit/. ~/boxedwine-build/
          ls -la ~/boxedwine-build

      - name: Cache the Wine filesystem
        uses: actions/cache@v4
        with:
          path: .cache/TinyCore15Wine11.0.zip
          key: wine-fs-e38234f93e85b1714c54f87ec3246a8275683b091219a8a4651ea7e3acd16b79

      - name: Build the site (vsthost, test plugins, shim, runtime)
        env:
          # Optional repository variable for a trusted mirror of the exact pinned
          # Wine filesystem. build.sh still verifies WINE_FS_SHA256 before use.
          WINE_FS_FALLBACK_URL: ${{ vars.BOXEDWINE_WINE_FS_MIRROR_URL }}
        run: BOXEDWINE_BUILD=~/boxedwine-build DIST=dist-mt WITH_DEXED=1 ./build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright (Chromium) for the wrapper
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Companion DLL browser and installed bundle gate
        env:
          RUNTIME_URL: ${{ inputs.runtime || vars.VSTLOADER_RUNTIME_URL || env.DEFAULT_RUNTIME_URL }}
        run: |
          python3 serve.py 8080 dist-mt > /tmp/companion-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          COMPANION_PRIMARY=build/companion_plugin.dll COMPANION_DEP=build/companion_dep.dll node tests/browser_render.mjs http://127.0.0.1:8080 ""
          mkdir -p build/wraps
          node wrap/wrap.mjs build/companion_plugin.dll --dep build/companion_dep.dll --site http://127.0.0.1:8080 --runtime "$RUNTIME_URL" --out build/wraps/companion-test.wclap.tar.gz
          tar xzOf build/wraps/companion-test.wclap.tar.gz resources/vstloader.txt | grep '^dependency=companion_dep[.]dll'
          tar tzf build/wraps/companion-test.wclap.tar.gz | grep -Fx resources/deps/companion_dep.dll

      - name: Installed companion WebCLAP gate in buzz-remote
        run: |
          git clone https://github.com/dahlgrenmartin/prometheos-apps.git /tmp/prometheos-apps
          git -C /tmp/prometheos-apps checkout 0372f92028f2ab46114acb149f1e3ef9a6174447
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version
          pnpm --dir /tmp/prometheos-apps install --frozen-lockfile
          node tests/buzz-remote/build.mjs --buzz /tmp/prometheos-apps/apps/buzz-remote --site dist-mt --plugins build/wraps
          node tests/buzz-remote/run.mjs --scenarios companion --out build/companion-buzz-remote

      - name: Stage verified Buzz fixture for browser wrapper
        run: |
          # wrap.mjs reads the plugin from the checkout; the served site is only
          # the runtime used to describe it.
          mkdir -p app
          cp 'build/FSM Kick XP.dll' 'app/FSM Kick XP.dll'

      - name: Wrap the plugins
        env:
          RUNTIME_URL: ${{ inputs.runtime || vars.VSTLOADER_RUNTIME_URL || env.DEFAULT_RUNTIME_URL }}
        run: |
          python3 serve.py 8080 dist-mt > /tmp/serve.log 2>&1 &
          sleep 1
          mkdir -p out
          for plugin in PoCSynth.dll:PoCSynth PoCSynth.vst3:PoCSynth-vst3 PoCInvert.dll:PoCInvert Dexed.dll:Dexed 'FSM Kick XP.dll:FSM-Kick-XP-Buzz'; do
            node wrap/wrap.mjs "app/${plugin%%:*}" --site http://127.0.0.1:8080 --runtime "$RUNTIME_URL" \
              --out "out/${plugin##*:}.wclap.tar.gz"
          done
          for bundle in out/*.wclap.tar.gz; do tar xzOf "$bundle" resources/vstloader.txt | sed -n 1,9p; done

      - name: Package the runtime
        env:
          RELEASE_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p pkg/vstloader
          # cp, not the hard links build.sh makes: GitHub Pages refuses links.
          cp -r dist-mt/runtime dist-mt/boxedwine pkg/vstloader/
          cp LICENSE pkg/vstloader/LICENSE
          cat > pkg/vstloader/SOURCES.md <<EOF
          # vstloader runtime ${RELEASE_NAME}

          Built from https://github.com/${GITHUB_REPOSITORY} at ${GITHUB_SHA} (GPL-3.0, LICENSE).

          - runtime/: the vstloader runtime page, the browser wrapper (wrap.html) and the
            vstloader WebCLAP shim (vstloader.wasm, from wclap/ in that repository).
          - boxedwine/boxedwine.*: Boxedwine (GPL-2.0-or-later), https://github.com/danoon2/Boxedwine
            at ${BOXEDWINE_COMMIT} with the patches in patches/boxedwine/ of the repository above,
            built with Emscripten ${EMSDK_VERSION}.
          - boxedwine/TinyCore15Wine11.0.zip: Boxedwine's Wine 11.0 filesystem (Wine: LGPL-2.1-or-later;
            Tiny Core Linux), from https://boxedwine.org/v2/10/TinyCore15Wine11.0.zip.
          - boxedwine/vstpoc.zip: vsthost.exe and the test plugins (this repository), and
            Dexed 0.9.3 (GPL-3.0, https://github.com/asb2m10/dexed/tree/v0.9.3).

          Serve this directory on the host's own origin (buzz-remote: <apps root>/vstloader/),
          cross-origin isolated (COOP/COEP). Wrap plugins at vstloader/runtime/wrap.html.
          EOF
          tar -czf out/vstloader-runtime.tar.gz -C pkg vstloader
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out && cat out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: vstloader-release
          path: out/
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vstloader-release
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="$(cat <<'EOF'
          32-bit Windows VST2 and VST3 plugins as WebCLAPs, for hosts with prometheos.runtime/1 (buzz-remote).

          - **vstloader-runtime.tar.gz**: the runtime site. Unpack it so the host serves `vstloader/` on its own origin, cross-origin isolated; for buzz-remote, next to the app (`<apps root>/vstloader/`). `vstloader/runtime/wrap.html` wraps any 32-bit `.dll` or `.vst3` into a bundle.
          - **\*.wclap.tar.gz**: wrapped plugins for buzz-remote's Plugins dialog: PoC Synth (VST2 and VST3), PoC Invert (an effect) and Dexed 0.9.3 (GPL-3.0). They name the runtime at the URL shown in each bundle's `resources/vstloader.txt`.

          Sources and licenses: `vstloader/SOURCES.md` in the runtime archive.
          EOF
          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Made on GitHub first: attach the files, and the notes if it has none.
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ -z "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
            fi
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "vstloader $TAG" --notes "$notes"
          fi
