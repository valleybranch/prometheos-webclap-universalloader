name: ci

# The Windows side: vsthost.exe and the VST2/VST3 test plugins, cross-compiled
# with MinGW, and the vstbridge layout checks. The Boxedwine/Emscripten build
# and the browser tests are run by hand (see README.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize VST3 pluginterfaces
        run: git submodule update --init vendor/pluginterfaces
      - name: Install MinGW (i686)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 g++-mingw-w64-i686 wine wine32:i386 zip
      - name: Build vsthost.exe and the test plugins
        run: |
          BUILD_SITE=0 ./build.sh
          i686-w64-mingw32-objdump -p build/PoCSynth.dll | grep -E 'VSTPluginMain|\bmain\b'
          i686-w64-mingw32-objdump -p build/PoCSynth.vst3 | grep GetPluginFactory
          node --check web/app.js
      - name: PE import probe and vstbridge contract
        run: |
          export WINEARCH=win32
          export WINEPREFIX="$RUNNER_TEMP/wine32"
          wineboot -u
          node tests/abi_layout.mjs
          wine build/pe_imports_test.exe
          node tests/import_probe_bridge.mjs
      - name: Build the vstloader WebCLAP (wasi-sdk) and check the runtime's scripts
        run: |
          git submodule update --init vendor/clap
          curl -fsSL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar xzf /tmp/wasi-sdk.tar.gz -C /tmp
          WASI_SDK=/tmp/wasi-sdk-25.0-x86_64-linux ./wclap/build.sh
          for f in runtime/*.js wrap/*.js wrap/*.mjs tests/buzz-remote/*.mjs; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: vstloader-windows
          path: |
            build/vstpoc.zip
            build/vstpoc-prefix.zip
